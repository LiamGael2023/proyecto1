# ========================================
# CONFIGURACIÓN DE SPRING BOOT
# ========================================

# Nombre de la aplicación
spring.application.name=demo

# Puerto del servidor (por defecto 8080)
server.port=8080

# ========================================
# CONFIGURACIÓN DE BASE DE DATOS H2
# ========================================
# H2 es una base de datos en memoria, perfecta para desarrollo

# URL de conexión JDBC
# jdbc:h2:mem:testdb = base de datos en memoria llamada 'testdb'
spring.datasource.url=jdbc:h2:mem:testdb

# Driver de la base de datos
spring.datasource.driver-class-name=org.h2.Driver

# Credenciales (por defecto para H2)
spring.datasource.username=sa
spring.datasource.password=

# ========================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ========================================

# Dialecto de Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ddl-auto define cómo Hibernate maneja el esquema:
# - create: Crea las tablas al iniciar (borra datos existentes)
# - create-drop: Crea al iniciar, elimina al cerrar
# - update: Actualiza el esquema sin borrar datos
# - validate: Solo valida, no modifica
# - none: No hace nada
spring.jpa.hibernate.ddl-auto=update

# Mostrar consultas SQL en consola (útil para aprendizaje)
spring.jpa.show-sql=true

# Formatear SQL para mejor legibilidad
spring.jpa.properties.hibernate.format_sql=true

# ========================================
# CONSOLA H2 (para ver la BD en navegador)
# ========================================
# Acceder en: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ========================================
# CONFIGURACIÓN DE LOGGING
# ========================================
# Niveles: TRACE, DEBUG, INFO, WARN, ERROR
logging.level.com.ejemplo.demo=DEBUG
logging.level.org.springframework.web=INFO
