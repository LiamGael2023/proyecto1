# ===========================================
# CONFIGURACIÓN DE AGROMARKET BACKEND
# ===========================================

# Nombre de la aplicación
spring.application.name=agromarket-backend

# Puerto del servidor
server.port=8080

# ===========================================
# CONFIGURACIÓN DE BASE DE DATOS H2
# ===========================================

# URL de conexión (base de datos en memoria)
spring.datasource.url=jdbc:h2:mem:agromarketdb

# Driver de la base de datos
spring.datasource.driver-class-name=org.h2.Driver

# Credenciales
spring.datasource.username=sa
spring.datasource.password=

# Habilitar consola web de H2 (accesible en /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===========================================
# CONFIGURACIÓN DE JPA/HIBERNATE
# ===========================================

# Dialecto de Hibernate para H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Estrategia de creación de tablas
# create-drop: Crea al iniciar, elimina al cerrar
# update: Actualiza el esquema sin perder datos
spring.jpa.hibernate.ddl-auto=create-drop

# Mostrar las consultas SQL en consola (útil para aprender)
spring.jpa.show-sql=true

# Formatear las consultas SQL
spring.jpa.properties.hibernate.format_sql=true

# ===========================================
# CONFIGURACIÓN DE LOGGING
# ===========================================

# Nivel de logging para ver más detalles
logging.level.com.agromarket=DEBUG
logging.level.org.springframework.web=INFO

# ===========================================
# CONFIGURACIÓN DE CORS
# ===========================================
# (Se configura en WebConfig.java para permitir Angular)
